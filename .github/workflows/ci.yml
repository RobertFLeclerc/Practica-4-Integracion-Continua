
name: Integracion Continua

on:
  push:
    branches:
      - main

jobs:
  notificacion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Hola Mundo
        run: node hola.js

      - name: Enviar notificacion a ntfy
        run: |
          curl --fail-with-body \
            -H "Title: Integracion Continua" \
            -d "Nueva actualizacion en GitHub - Practica 4 ITLA" \
            https://ntfy.sh/devops-itla
